[project]
name = "battlemap-mcp"
version = "1.0.0"
description = "MCP server bridging an LLM to a running Dungeondraft instance via its modding API"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2.1,<3", "Pillow>=10.4"]

[project.scripts]
battlemap-mcp = "battlemap_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["battlemap_mcp"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
