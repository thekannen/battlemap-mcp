name: Dependency security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install package and dependency auditor
        # The runner's Python ships its own setuptools, which is not one of
        # this project's dependencies; keep it current so the audit reports
        # on what the project actually installs.
        run: python -m pip install --upgrade -e ./server pip-audit "setuptools>=83"
      - name: Audit installed dependencies
        run: python -m pip_audit --local --skip-editable
