name: Build release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the private candidate repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GH_REPO" = "thekannen/battlemap-mcp"
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = "true"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check package version and tag
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python tools/release.py check --tag "$REF_NAME"
          else
            python tools/release.py check
          fi
          python -c 'import os,tomllib; v=tomllib.load(open("server/pyproject.toml","rb"))["project"]["version"]; open(os.environ["GITHUB_OUTPUT"],"a").write(f"version={v}\n")'
      - name: Install test dependencies
        run: python -m pip install -e './server[dev]'
      - name: Offline gate
        run: python server/tools/gate.py
      - name: Release tooling checks
        run: |
          python -m ruff check tools/release.py tools/collect_release.py
          python -m ruff format --check tools/release.py tools/collect_release.py

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-14
            platform: macos-arm64
          - runner: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build and smoke-test native companion
        run: python tools/release.py build --out dist/release --companion
      - name: Verify archive after extraction
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, tarfile, zipfile
          version = os.environ['PACKAGE_VERSION']
          platform = os.environ['PACKAGE_PLATFORM']
          ext = 'zip' if platform.startswith('windows') else 'tar.gz'
          archive = pathlib.Path('dist/release') / f'battlemap-mcp-companion-{version}-{platform}.{ext}'
          target = pathlib.Path('dist/extracted')
          target.mkdir()
          if ext == 'zip':
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(target)
          else:
              with tarfile.open(archive) as bundle:
                  bundle.extractall(target, filter='data')
          name = 'battlemap-mcp.exe' if ext == 'zip' else 'battlemap-mcp'
          executable, = (p for p in target.rglob(name) if p.is_file())
          subprocess.run([sys.executable, 'tools/release.py', 'smoke', str(executable)], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Assemble exact assets and checksums
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: python tools/collect_release.py artifacts release --version "$PACKAGE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [validate, assemble]
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'thekannen/battlemap-mcp' && github.event.repository.private == true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GH_REPO" = "thekannen/battlemap-mcp"
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = "true"
          cat > notes.md <<'NOTES'
          Private test packages. Download the mod ZIP and the companion for your
          platform from this same version. Extract the mod into your selected
          Dungeondraft mods folder; extract the whole companion into a permanent
          user-owned folder and run its executable with `setup --client codex`
          or `setup --client claude-code`.

          SHA256SUMS covers every download. These companions are unsigned private
          test builds, not approved public releases. Final acceptance of these renamed
          packages remains pending on each target OS and client. CI verifies
          package startup and MCP initialization; live editor acceptance is manual.
          NOTES
          gh release create "$RELEASE_TAG" release/* --repo "$GH_REPO" --verify-tag --draft --prerelease --title "$RELEASE_TAG — private test packages" --notes-file notes.md
