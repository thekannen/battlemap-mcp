name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e "./server[dev]"
      - name: Offline gate
        run: python server/tools/gate.py
      - name: Check release versions
        run: python tools/release.py check
      - name: Check release tools
        run: |
          python -m ruff check tools/release.py tools/collect_release.py
          python -m ruff format --check tools/release.py tools/collect_release.py
